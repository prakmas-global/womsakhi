[pytest]
testpaths = tests
# Auto mode so an async test needs no per-test decorator. Every test in the
# suite today is synchronous and offline; this is here for the DB-backed ones
# that will follow.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
