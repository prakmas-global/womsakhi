# Deploy alongside your monitoring service after setting the API host and secret mount.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: womsakhi-api
    scheme: https
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/womsakhi-monitoring-token
    static_configs:
      - targets: [api.womsakhi.com]
