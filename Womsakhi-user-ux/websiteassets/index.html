<style>
:root{--bg:#fbf9ff;--fg:#1c1330;--muted:#6b5e86;--line:#e6e0f2;--accent:#7c3aed}
*{box-sizing:border-box}
body{margin:0;padding:40px 28px 80px;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{max-width:1200px;margin:0 auto 36px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
p.sub{margin:0;color:var(--muted)}
h2{max-width:1200px;margin:38px auto 14px;font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:10px}
h2 .n{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:2px 9px;letter-spacing:0}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.box{height:150px;display:flex;align-items:center;justify-content:center;padding:12px;
background-image:linear-gradient(45deg,#f1edf9 25%,transparent 25%),linear-gradient(-45deg,#f1edf9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f1edf9 75%),linear-gradient(-45deg,transparent 75%,#f1edf9 75%);
background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.box img{max-width:100%;max-height:100%;object-fit:contain}
figcaption{padding:9px 11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
figcaption b{font-size:12px;font-weight:600;word-break:break-all}
figcaption span{font-size:11px;color:var(--muted)}
